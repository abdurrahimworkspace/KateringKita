<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 844" width="390" height="844" id="Screen_02_Login">
    <!-- 02. Login Screen -->
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
            text {
                font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
        </style>
        <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF6B35"/>
            <stop offset="100%" stop-color="#FF8243"/>
        </linearGradient>
        <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#005AF5"/>
            <stop offset="100%" stop-color="#2D7BFF"/>
        </linearGradient>
        <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#262017" flood-opacity="0.05"/>
        </filter>
        <filter id="btn-shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF6B35" flood-opacity="0.28"/>
        </filter>
        <filter id="btn-blue-shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#005AF5" flood-opacity="0.25"/>
        </filter>
        <filter id="btn-wa-shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10B981" flood-opacity="0.28"/>
        </filter>
        <filter id="float-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#262017" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- Canvas Frame (390 x 844, rx=40) -->
    <rect width="390" height="844" rx="40" fill="#F9F8F6"/>
    <!-- Frame Border -->
    <rect width="390" height="844" rx="40" fill="none" stroke="#ECEAE5" stroke-width="1.5"/>

    
    <g id="LoginScreen">
        <!-- Top Header Band -->
        <path d="M 0,0 L 390,0 L 390,110 L 0,110 Z" fill="#F0EFEA"/>
        <text x="32" y="80" font-size="24" font-weight="800" fill="#262017">Login</text>
        
        <!-- Form Container -->
        <g transform="translate(32, 140)">
            <!-- Email Field -->
            <text x="2" y="16" font-size="13" font-weight="700" fill="#262017">Email Address</text>
            <rect x="0" y="28" width="326" height="50" rx="14" fill="#FFFFFF" stroke="#ECEAE5" stroke-width="1.2" filter="url(#card-shadow)"/>
            <text x="16" y="58" font-size="13.5" font-weight="500" fill="#262017">abdurrahim@student.ub.ac.id</text>
            
            <!-- Password Field -->
            <text x="2" y="112" font-size="13" font-weight="700" fill="#262017">Password</text>
            <rect x="0" y="124" width="326" height="50" rx="14" fill="#FFFFFF" stroke="#ECEAE5" stroke-width="1.2" filter="url(#card-shadow)"/>
            <!-- Password dots -->
            <text x="16" y="156" font-size="18" font-weight="700" fill="#4D4542">••••••••••••</text>
            <!-- Eye toggle icon -->
            <path d="M 292,149 C 295,145 303,145 306,149 M 299,149 A 2.5 2.5 0 1 1 299,150" stroke="#4D4542" stroke-width="1.6" fill="none"/>
        </g>
        
        <!-- Primary Login CTA Button -->
        <g transform="translate(32, 340)">
            <rect width="326" height="52" rx="16" fill="url(#primary-grad)" filter="url(#btn-shadow)"/>
            <text x="163" y="32" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Login</text>
        </g>
        
        <!-- Action Links -->
        <g transform="translate(195, 424)">
            <text x="0" y="0" font-size="13" font-weight="600" fill="#005AF5" text-anchor="middle">Forgot Password?</text>
            <text x="0" y="28" font-size="13" font-weight="500" fill="#4D4542" text-anchor="middle">Belum punya akun? <tspan font-weight="700" fill="#FF6B35">Create New Account</tspan></text>
        </g>
        
        
    <g id="HomeIndicator">
        <rect x="128" y="820" width="134" height="5" rx="2.5" fill="#262017" opacity="0.2"/>
    </g>
    
    </g>
    
</svg>
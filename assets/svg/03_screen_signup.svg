<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 844" width="390" height="844" id="Screen_03_SignUp">
    <!-- 03. Sign Up Screen -->
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
            text {
                font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
        </style>
        <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF6B35"/>
            <stop offset="100%" stop-color="#FF8243"/>
        </linearGradient>
        <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#005AF5"/>
            <stop offset="100%" stop-color="#2D7BFF"/>
        </linearGradient>
        <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#262017" flood-opacity="0.05"/>
        </filter>
        <filter id="btn-shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF6B35" flood-opacity="0.28"/>
        </filter>
        <filter id="btn-blue-shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#005AF5" flood-opacity="0.25"/>
        </filter>
        <filter id="btn-wa-shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10B981" flood-opacity="0.28"/>
        </filter>
        <filter id="float-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#262017" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- Canvas Frame (390 x 844, rx=40) -->
    <rect width="390" height="844" rx="40" fill="#F9F8F6"/>
    <!-- Frame Border -->
    <rect width="390" height="844" rx="40" fill="none" stroke="#ECEAE5" stroke-width="1.5"/>

    
    <g id="SignUpScreen">
        <!-- Top Header Band -->
        <path d="M 0,0 L 390,0 L 390,105 L 0,105 Z" fill="#F0EFEA"/>
        <text x="32" y="75" font-size="24" font-weight="800" fill="#262017">Create Account</text>
        
        <!-- Form Inputs -->
        <g transform="translate(32, 125)">
            <!-- Full Name -->
            <rect width="326" height="48" rx="14" fill="#FFFFFF" stroke="#ECEAE5" stroke-width="1.2" filter="url(#card-shadow)"/>
            <text x="16" y="29" font-size="13" font-weight="500" fill="#262017">Abdurrahim</text>
            
            <!-- Email Address -->
            <rect y="64" width="326" height="48" rx="14" fill="#FFFFFF" stroke="#ECEAE5" stroke-width="1.2" filter="url(#card-shadow)"/>
            <text x="16" y="93" font-size="13" font-weight="500" fill="#262017">abdurrahim@student.ub.ac.id</text>
            
            <!-- Phone Number -->
            <rect y="128" width="326" height="48" rx="14" fill="#FFFFFF" stroke="#ECEAE5" stroke-width="1.2" filter="url(#card-shadow)"/>
            <text x="16" y="157" font-size="13" font-weight="500" fill="#262017">0812-3456-7890</text>
            
            <!-- Password -->
            <rect y="192" width="326" height="48" rx="14" fill="#FFFFFF" stroke="#ECEAE5" stroke-width="1.2" filter="url(#card-shadow)"/>
            <text x="16" y="222" font-size="16" font-weight="700" fill="#4D4542">••••••••••••</text>
            
            <!-- Checkbox & T&C -->
            <g transform="translate(0, 260)">
                <rect width="20" height="20" rx="6" fill="#FF6B35"/>
                <path d="M 5,10 L 8.5,13.5 L 15,6.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="30" y="15" font-size="12" font-weight="500" fill="#262017">I agree to <tspan font-weight="700" fill="#005AF5">Terms &amp; Conditions</tspan></text>
            </g>
            
            <!-- Sign Up Button -->
            <g transform="translate(0, 305)">
                <rect width="326" height="52" rx="16" fill="url(#primary-grad)" filter="url(#btn-shadow)"/>
                <text x="163" y="32" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sign Up</text>
            </g>
        </g>
        
        
    <g id="HomeIndicator">
        <rect x="128" y="820" width="134" height="5" rx="2.5" fill="#262017" opacity="0.2"/>
    </g>
    
    </g>
    
</svg>